{% extends 'layouts.html'%}

{% block title%}
 Tweet
{% endblock %}

{% block content%}

<h1>This is the tweet form page</h1>
<h3>
    {% if form.instance.pk %} 
        Edit Tweet 
    {% else %} 
        Create Tweet 
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %} 
        {{ form }}
        <button class="btn btn-warning" type="submit">Submit</button>
    </form>
    <a href="{% url 'tweet_list'%}">Back to Home</a>
</h3>

{% endblock %}
